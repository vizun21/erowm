{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{% block page_title %}인쇄페이지{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; font-family: '맑은 고딕', '나눔고딕', sans-serif; font-size: 8pt; background-color: #FAFAFA; }

        .page {
            position: relative;
            width: 21cm; min-height: 29.3cm; max-height: 29.3cm;
            padding: 1.5cm 1.5cm 1.5cm 2cm;
            margin: 1cm auto;
            border: 1px #D3D3D3 solid; border-radius: 5px;
            background: white; box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }
        .toolbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
            background: #1e293b; color: #fff;
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .toolbar-title { font-size: 15px; font-weight: 700; }
        .toolbar-sub   { font-size: 11px; color: #94a3b8; margin-left: 10px; }
        .btn-pdf   { background:#16a34a; color:#fff; border:none; border-radius:6px; padding:7px 18px; font-size:13px; font-weight:700; cursor:pointer; margin-left:8px; }
        .btn-print { background:#3b82f6; color:#fff; border:none; border-radius:6px; padding:7px 18px; font-size:13px; font-weight:700; cursor:pointer; margin-left:8px; }
        .btn-close { background:#475569; color:#fff; border:none; border-radius:6px; padding:7px 14px; font-size:13px; cursor:pointer; margin-left:8px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #000; padding: 2px 3px; font-size: 7pt; vertical-align: middle; }
        th { background: #e8e8e8; font-weight: bold; text-align: center; }
        td.right  { text-align: right; }
        td.center { text-align: center; }
        td.left   { text-align: left; }
        h1 { font-size: 14pt; font-weight: bold; letter-spacing: 4px; text-align: center; margin-bottom: 4mm; }
        h2 { font-size: 11pt; font-weight: bold; text-align: center; margin-bottom: 3mm; }
        .unit { text-align: right; font-size: 7pt; color: #333; margin-bottom: 2mm; }

        @page { size: A4 portrait; margin: 0; }
        @media print {
            .toolbar { display: none !important; }
            body { background: white !important; padding-top: 0 !important; }
            .page { margin:0; border:none; border-radius:0; width:initial; box-shadow:none; min-height:29.3cm; max-height:29.3cm; page-break-after:always; }
            .page:last-child { page-break-after: auto; }
        }
    </style>
</head>
<body style="padding-top:52px;">
    <div class="toolbar">
        <div>
            <span class="toolbar-title">{% block toolbar_title %}{{ business.name }} 출력문서{% endblock %}</span>
            <span class="toolbar-sub">{% block toolbar_sub %}{% endblock %}</span>
        </div>
        <div>
            <button class="btn-pdf" id="btnPdf">📥 PDF 저장</button>
            <button class="btn-print" onclick="window.print()">🖨 인쇄</button>
            <button class="btn-close" onclick="window.close()">✕ 닫기</button>
        </div>
    </div>
    <div id="printArea">
        {% block content %}{% endblock %}
    </div>
    <script>
    (function(){
        var btn=document.getElementById('btnPdf');
        if(!btn)return;
        var FILENAME='{% block pdf_filename %}출력문서{% endblock %}.pdf';
        btn.addEventListener('click',function(){
            btn.disabled=true; btn.textContent='생성 중...';
            if(window.html2pdf){runPdf();return;}
            var s=document.createElement('script');
            s.src='https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js';
            s.onload=runPdf;
            s.onerror=function(){btn.disabled=false;btn.innerHTML='📥 PDF 저장';alert('PDF 라이브러리 로드 실패');};
            document.head.appendChild(s);
        });
        function runPdf(){
            var el=document.getElementById('printArea')||document.body;
            html2pdf().set({
                margin:[8,8,8,15], filename:FILENAME,
                image:{type:'jpeg',quality:0.98},
                html2canvas:{scale:2,useCORS:true,logging:false,letterRendering:true},
                jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
                pagebreak:{mode:['avoid-all','css','legacy']}
            }).from(el).save()
            .then(function(){btn.disabled=false;btn.innerHTML='📥 PDF 저장';})
            .catch(function(e){btn.disabled=false;btn.innerHTML='📥 PDF 저장';alert('PDF 오류: '+e.message);});
        }
    })();
    </script>
</body>
</html>
